on:
  schedule:
    - cron: "0 0 15,30 3-11 *"
    
  push:
    branches:
      - '28-fetch-data-fails'

  workflow_dispatch:
    
name: fetch-data

jobs:
  fetch-data:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,   r: 'release'}
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_TOKEN: ${{ secrets.AUTOMATISATION }}
      SK_FORMS: ${{ secrets.SK_FORMS }}
      BYCATCH: ${{ secrets.BYCATCH }}
      AUTOMATON: ${{ secrets.AUTOMATON}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATISATION }}

      - name: Setup R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: Install linux libraries
        run: |
          sudo apt install libsodium-dev
          sudo apt-get install libcurl4-openssl-dev
          sudo apt-get install libgdal-dev libproj-dev
          sudo apt install libudunits2-dev
          sudo apt-get update && sudo apt-get install -y libmagick++-dev
          sudo apt-get install -y libprotobuf-dev protobuf-compiler libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libglib2.0-dev

      - name: Install R dependencies
        run: |
         Rscript -e "install.packages(c('protolite', 'textshaping', 'svglite', 'ragg', 'leafpop', 'mapview', 'pkgdown', 'devtools', 'lubridate'), repos = 'https://cloud.r-project.org')"
         Rscript -e "remotes::install_github('inbo/fistools')"

      - name: Install R packages
        run: |
           source("script/install_packages.R")
           
        shell: Rscript {0}
        
      - name: Fetch data
        run: |
          source("script/run_fetch_data.R")
        shell: Rscript {0}

      - name: Commit and push changes
        uses: devops-infra/action-commit-push@f27e0951b748268e6ac8d91861eeac5bc2bd36a8 # master
        with:
          github_token: ${{ secrets.AUTOMATISATION }}
          commit_prefix: "[AUTO]"
          commit_message: "Fetch data"
          target_branch: automatic-update
          add_timestamp: true

      - name: Get branch name
        run: |
          git branch --show-current

      - name: Create pull request
        uses: devops-infra/action-pull-request@3f1cdfa7c7976f6302e820e2b391e846d933693c # v0.4.2
        with:
          github_token: ${{ secrets.AUTOMATISATION }}
          target_branch: main
          title: "[AUTO] Update data"
          template: .github/PR_fetch_data.md
          reviewer: SanderDevisscher
          label: automated workflow
          get_diff: false
